name: Frontend checks
on:
  push:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml', 'render.yaml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml', 'render.yaml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_DEMO_MODE: 'false'
